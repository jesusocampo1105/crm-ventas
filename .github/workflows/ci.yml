# Corre en cada push a main, en cada pull request y a mano desde la pestaña Actions.
# Instala con el lockfile, compila, comprueba tipos y ejecuta los tests.
# En un push a main, si eso pasa, publica la interfaz en GitHub Pages:
# https://<usuario>.github.io/<repositorio>/
# Lint, Prisma, cobertura y el chequeo de drift del contrato se añaden cuando
# existan esos comandos (docs/deployment.md §7 los describe por adelantado).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Los scripts del repo invocan `corepack pnpm`. Sin esto, Corepack se queda
  # esperando confirmación para descargar pnpm y el job no termina.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  verify:
    name: instalar · compilar · typecheck · tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lee la versión de `packageManager` en package.json (pnpm@12.8.1).
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # `pnpm typecheck` y `pnpm test` delegan en `corepack pnpm` a propósito:
      # en local pnpm no está en el PATH. Este paso deja ese camino usable en el runner.
      - name: Activar Corepack
        run: corepack enable && corepack install

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

  # La interfaz llama a /api con rutas relativas: en producción las sirve el mismo
  # origen que la SPA. Pages solo puede publicar el build estático, así que el API
  # no queda encendido en ese dominio.
  publicar:
    name: compilar interfaz
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Activar Corepack
        run: corepack enable && corepack install

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar el contrato
        run: pnpm --filter @crm/contracts build

      - name: Compilar la interfaz
        run: pnpm --filter @crm/web exec ng build --base-href /${{ github.event.repository.name }}/

      - name: Preparar el sitio para Pages
        shell: bash
        run: |
          site=apps/web/dist/web/browser
          test -f "$site/index.html"
          cp "$site/index.html" "$site/404.html"
          touch "$site/.nojekyll"

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/web/browser

  desplegar:
    name: desplegar
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
